function add(me, cast = true) { me.castShadow = cast; me.receiveShadow = true; G.add(me); return me; }
function box(x0, x1, z0, z1, y0, y1, m, cast = true) {
  const me = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), m);
  me.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return add(me, cast);
}
function bar(a, b, w, h, m) {  // box of section w x h from point a to point b ([x, y, z])
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, A.distanceTo(B)), m);
  me.position.copy(A).add(B).multiplyScalar(0.5); me.lookAt(B);
  return add(me);
}
function cyl(x, z, y0, y1, r, m, seg = 16) {

function wedge(x0, x1, z0, z1, h, m) {
  const g = new THREE.BoxGeometry(1, 1, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const sx = p.getX(i) > 0, sz = p.getZ(i) > 0;

  g.computeVertexNormals();

const NORTH = 317 * Math.PI / 180;

  Object.assign(mk('text', { 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 13, 'font-weight': 700, fill: c }), { textContent: t }));
